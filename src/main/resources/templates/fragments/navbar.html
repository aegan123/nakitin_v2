<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fi">
<body>
<nav class="navbar is-fixed-top has-shadow" role="navigation" aria-label="main navigation"
     th:fragment="navbar">
    <div class="navbar-brand">
        <a class="navbar-item" href="/">
            <img
                src="https://www.asteriski.fi/wp-content/themes/wp-asteriski-theme/assets/img/asteriski-logo.png"
                width="46" height="46" alt="Asteriski logo"/>
        </a>

        <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbar">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
        </a>
    </div>

    <div id="navbar" class="navbar-menu">
        <div class="navbar-start">
            <a class="navbar-item" th:href="@{/}" th:text="#{index.label.link}"></a>

            <a class="navbar-item" th:href="@{/organizations}" th:text="#{index.label.organisations}"></a>
            <a class="navbar-item" th:href="@{/privacy}" th:text="#{index.label.privacy}"></a>
        </div>

        <div class="navbar-end">
            <!--/*@thymesVar id="userIsOrganisationAdmin" type="java.lang.Boolean"*/-->
            <!--/*@thymesVar id="userIsLoggedIn" type="java.lang.Boolean"*/-->
            <!--/*@thymesVar id="userIsAdmin" type="java.lang.Boolean"*/-->
            <div class="navbar-item">
                <a th:if="${userIsAdmin}" th:text="#{navbar.links.label.admin}" th:href="@{/admin}"></a>
            </div>
            <div class="navbar-item">
                <a th:if="${userIsOrganisationAdmin}" th:text="#{form.button.label.new-event}" th:href="@{/add-event}"></a>
            </div>
            <div class="navbar-item">
                <a th:if="${userIsLoggedIn}" th:text="#{form.button.label.profile}" th:href="@{/profile}"></a>
            </div>
            <div class="navbar-item">
                <div class="buttons" th:if="${userIsLoggedIn}">
                    <form th:action="@{/logout}" method="post">
                        <button class="button is-warning" type="submit" th:text="#{form.button.label.logout}"></button>
                    </form>
                </div>
                <div class="buttons" th:unless="${userIsLoggedIn}">
                    <a class="button is-primary" th:text="#{form.button.label.sign-up}" th:href="@{/signup}"></a>
                    <a class="button is-light" th:text="#{form.button.label.login}" th:href="@{/login}"></a>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
