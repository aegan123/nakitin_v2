<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fi" data-theme="dark" class="has-navbar-fixed-top">
<head th:replace="~{fragments/header.html :: header}">
</head>
<body>
<nav th:replace="~{fragments/navbar.html  ::  navbar}"></nav>
<div class="columns is-gapless" th:fragment="columns">
    <div class="column is-4 is-desktop"></div>
    <div class="column">
        <div class="content">
            <h1 class="title has-text-centered" th:text="#{deleteTask.title}"></h1>
            <p th:text="#{deleteTask.text.p1}"></p>
            <div class="block" th:utext="${deleteInfo}"></div>
            <div th:if="${!task.volunteers.isEmpty()}" class="block" th:text="#{deleteTask.text.p2}"></div>
            <ul th:if="${!task.volunteers.isEmpty()}" th:each="user : ${task.volunteers}">
                <li th:text="${user.firstName} + ' ' + ${user.lastName}"></li>
            </ul>
            <p th:text="#{deleteTask.text.p3}"></p>
            <ul>
                <li th:text="#{deleteTask.text.volunteers}"></li>
            </ul>
            <p th:utext="#{deleteConfirmation.text}"></p>
            <form th:action="@{/task/delete}" method="post" th:object="${deleteForm}">
                <input type="hidden" th:field="*{id}" name="userId" th:value="${task.id}"/>
                <input type="hidden" th:field="*{id2}" name="userId" th:value="${deleteForm.id2}"/>
                <div class="field is-grouped is-left">
                    <p class="control">
                        <input type="submit" th:value="#{form.button.label.delete}" class="button is-danger">
                    </p>
                    <p class="control">
                        <a th:href="@{/event/{eventId}(eventId=${deleteForm.id2})}" th:text="#{form.button.label.back}" class="button is-primary"></a>
                    </p>
                </div>
            </form>
        </div>
    </div>
    <div class="column is-4 is-desktop"></div>
</div>
<script th:src="@{/js/nakitin.js}"></script>
</body>
</html>
