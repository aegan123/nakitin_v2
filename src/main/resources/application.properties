spring.application.name=nakitin
logging.level.root=INFO
spring.profiles.active=dev
logging.file.name = /tmp/nakitin.log
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:nakitin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.jpa.open-in-view=false
# Mail config
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=username
spring.mail.password=password
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Quartz config
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.properties.org.quartz.threadPool.threadCount=50
spring.quartz.properties.org.quartz.jobStore.class=org.springframework.scheduling.quartz.LocalDataSourceJobStore

server.compression.enabled=true
server.compression.min-response-size=10240
spring.mvc.format.date=iso
spring.mvc.format.time=iso

# Custom configs
fi.asteriski.config.maxPasswordAgeInDays=365
fi.asteriski.config.user.daysBeforeExpireToRemind=30
fi.asteriski.config.user.monthsToDeleteExpiredUsers=12
fi.asteriski.config.email.default-sender-address=noreply@asteriski.fi
fi.asteriski.config.passwordResetTokenExpirationHours=24
fi.asteriski.config.cleanup.unverifiedUsersCron=0 */1 * * * *
fi.asteriski.config.cleanup.passwordResetCron=0 */1 * * * *
fi.asteriski.config.cleanup.expiringPasswordCron=0 */1 * * * *
fi.asteriski.config.cleanup.expiringUsersCron=0 */1 * * * *
fi.asteriski.config.cleanup.expiredUsersCron=0 */1 * * * *

# Rate limiting configuration
ratelimit.login.maxAttempts=5
ratelimit.login.refillAmount=5
ratelimit.login.refillMinutes=15

ratelimit.passwordReset.maxAttempts=3
ratelimit.passwordReset.refillAmount=3
ratelimit.passwordReset.refillHours=1

# Cache configuration
cache.login.expiryHours=1
cache.passwordReset.expiryHours=24

# Security configuration
security.rememberMe.validitySeconds=86400
security.rememberMe.key=uniqueAndSecretKey
