admin.addUser.label.help.isAdminHelpText=Nakittimen adminilla on p\u00E4\u00E4sy kaikkeen tietoon, joka j\u00E4rjestelm\u00E4\u00E4n on tallennettu. Nakittimen admin voi lis\u00E4t\u00E4, poistaa ja muokata k\u00E4ytt\u00E4ji\u00E4, kaikkia tapahtumia ja niiden nakkeja. Nakittimen adminit my\u00F6s n\u00E4kev\u00E4t kaikkien k\u00E4ytt\u00E4jien henkil\u00F6tiedot.<br/><strong>Anna n\u00E4m\u00E4 oikeudet vain harvoille ja valituille luotetuille tahoille!</strong>

