admin.addUser.label.isAdminHelpText=Valitse t\u00E4m\u00E4 vain siin\u00E4 tapauksessa, ett\u00E4 uusi k\u00E4ytt\u00E4j\u00E4 on nakittimen admin!
admin.addUser.label.help.orgAdmin.text=J\u00E4rjest\u00F6n adminina k\u00E4ytt\u00E4j\u00E4 voi lis\u00E4t\u00E4, muokata ja poistaa tapahtumia ja niiden nakkeja k.o. j\u00E4rjest\u00F6n nimiss\u00E4. K\u00E4ytt\u00E4j\u00E4 n\u00E4kee my\u00F6s kaikkien k.o. j\u00E4rjest\u00F6n tapahtumiin nakittautuneiden j\u00E4rjestelm\u00E4st\u00E4 l\u00F6ytyv\u00E4t henkil\u00F6tiedot.
admin.addUser.label.help.isAdminHelpText=Nakittimen adminilla on p\u00E4\u00E4sy kaikkeen tietoon, joka j\u00E4rjestelm\u00E4\u00E4n on tallennettu. Nakittimen admin voi lis\u00E4t\u00E4, poistaa ja muokata k\u00E4ytt\u00E4ji\u00E4, kaikkia tapahtumia ja niiden nakkeja. Nakittimen adminit my\u00F6s n\u00E4kev\u00E4t kaikkien k\u00E4ytt\u00E4jien henkil\u00F6tiedot.<br/><strong>Anna n\u00E4m\u00E4 oikeudet vain harvoille ja valituille luotetuille tahoille!</strong>

