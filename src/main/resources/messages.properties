index.welcome.title=Tervetuloa Nakittimeen!
index.welcome.p1=Nakitin on tapahtumaj\u00E4rjest\u00E4jille suunniteltu ty\u00F6kalu, jossa k\u00E4ytt\u00E4j\u00E4t voivat ilmoittautua vapaaehtoisiksi tapahtumiin. Ensisijaisesti Nakitin on kehitetty Asteriskin tarpeisiin.
index.welcome.p2=Mik\u00E4li haluat oman yhdistyksesi mukaan Nakittimeen ota yhteytt\u00E4 <a href="https://www.asteriski.fi/virallista/yhteystiedot/">Asteriskin</a> hallitukseen.
index.welcome.p3=Teknisiss\u00E4 ongelmissa tai -kysymyksiss\u00E4 ota yhteytt\u00E4 yll\u00E4pit\u00E4jiin: palvelinvastaava[\u00E4t]asteriski.fi.

privacy.label.title=Tietosuoja
privacy.paragraph.first=Kirjautumattomilta vierailijoilta ei ker\u00E4t\u00E4 mit\u00E4\u00E4n <a href="https://eur-lex.europa.eu/eli/reg/2016/679" target=""_blank>GDPR:n</a> alaista tietoa.
privacy.paragraph.second=Rekister\u00F6itym\u00E4ll\u00E4 palveluun hyv\u00E4ksyt, ett\u00E4 palvelu ker\u00E4\u00E4 ja tallentaa seuraavat tiedot:
privacy.paragraph.third=N\u00E4it\u00E4 tietoja k\u00E4ytet\u00E4\u00E4n ainoastaan tapahtumaan liittyvien nakkeihin nakittautumiseen ja siihen liityv\u00E4\u00E4n viestint\u00E4\u00E4n ja muihin n\u00E4ihin liittyviin toiminteisiin. Tiedot ovat tapahtuman luoneen tahon ja j\u00E4rjestelm\u00E4n yll\u00E4pidon n\u00E4ht\u00E4viss\u00E4.
privacy.paragraph.fourth=Yksitt\u00E4iseen nakkiin ilmoittautuneiden lista on n\u00E4ht\u00E4vill\u00E4 my\u00F6s muille sis\u00E4\u00E4nkirjautuneille k\u00E4ytt\u00E4jille.
privacy.paragraph.fifth=Tapahtumiin ja nakittautumisiin liittyvi\u00E4 tietoja s\u00E4ilytet\u00E4\u00E4n enint\u00E4\u00E4n vuoden ajan tapahtumap\u00E4iv\u00E4st\u00E4 lukien, jonka j\u00E4lkeen tiedot poistetaan j\u00E4rjestelm\u00E4st\u00E4 automaattisesti.
privacy.paragraph.sixth=Tietoja s\u00E4ilytet\u00E4\u00E4n alan parhaita k\u00E4yt\u00E4nt\u00F6j\u00E4 noudattaen suojattuna EU alueella.
privacy.paragraph.seventh=GDPR:n mukainen rekisterinpit\u00E4j\u00E4 ja datan prosessoija on Asteriski RY. Mik\u00E4li haluat hy\u00F6dynt\u00E4\u00E4 <a href="https://eur-lex.europa.eu/eli/reg/2016/679" target=""_blank>GDPR:n</a> takaamia oikeuksia ota yhteytt\u00E4 Asteriskin <a href="https://www.asteriski.fi/virallista/yhteystiedot/" target="_blank">hallitukseen</a>.
