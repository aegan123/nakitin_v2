event.page.label.help.text=Tapahtumasivulla nakit j\u00E4rjestet\u00E4\u00E4n ensisijaisesti p\u00E4iv\u00E4m\u00E4\u00E4r\u00E4n ja toissijaisesti aloitusajan mukaan. Mik\u00E4li j\u00E4t\u00E4t p\u00E4iv\u00E4m\u00E4\u00E4r\u00E4n tyhj\u00E4ksi niin nakille asetetaan tapahtuman p\u00E4iv\u00E4m\u00E4\u00E4r\u00E4. Henkil\u00F6m\u00E4\u00E4r\u00E4 on maksimim\u00E4\u00E4r\u00E4 henkil\u00F6it\u00E4, jotka voivat ilmoittautua yhteen nakkiin.

