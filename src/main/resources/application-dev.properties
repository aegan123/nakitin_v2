spring.application.name=Nakitin
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:nakitin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
#spring.servlet.multipart.max-file-size=2MB
#spring.servlet.multipart.max-request-size=2MB
spring.jpa.open-in-view=false
spring.datasource.username=postgres
spring.datasource.password=1234

# Initial user config
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password= ${ADMIN_PASSWORD:admin}
app.admin.email=${ADMIN_EMAIL:root@localhost}
app.admin.firstName=${ADMIN_FIRST_NAME:admin}
app.admin.lastName=${ADMIN_LAST_NAME:admin}
app.admin.initialization.enabled=${ENABLE_ADMIN_CREATION:true}
