logging.level.root=ERROR
spring.profiles.active=prod
spring.security.filter.order=10

# server config
server.port=${SERVER_PORT}
server.address=${SERVER_HOST}
server.ssl.enabled=${SERVER_ENABLE_SSL}

# DB config
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# mail config
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Custom configs
fi.asteriski.config.maxPasswordAgeInDays=${PASSWORD_MAX_AGE}
fi.asteriski.config.user.daysBeforeExpireToRemind=${DAYS_BEFORE_SENDING_EXPIRY_NOTIFICATION:30}
fi.asteriski.config.user.monthsToDeleteExpiredUsers=${MONTHS_BEFORE_DELETING_EXPIRED_USERS:12}
fi.asteriski.config.passwordResetTokenExpirationHours=${PASSWORD_RESET_TOKEN_EXPIRATION:24}
fi.asteriski.config.cleanup.deleteUnverifiedUsersCron=@weekly
fi.asteriski.config.cleanup.passwordResetTokensCron=@weekly
fi.asteriski.config.cleanup.expiringPasswordReminderCron=0 50 23 * * *
fi.asteriski.config.cleanup.disableExpiringUsersCron=0 52 23 * * *
fi.asteriski.config.cleanup.deleteExpiredUsersCron=0 55 23 * * *
fi.asteriski.config.cleanup.accountDeletionReminderCron=0 54 23 * * *

# Rate limiting configuration
ratelimit.login.maxAttempts=${RATE_LIMIT_MAX_LOGIN_ATTEMPTS:5}
ratelimit.login.refillAmount=${RATE_LIMIT_MAX_REFILL_AMOUNT:5}
ratelimit.login.refillMinutes=${RATE_LIMIT_MAX_REFILL_MINUTES:15}

ratelimit.passwordReset.maxAttempts=${RATE_LIMIT_PASSWORD_RESET_MAX_ATTEMPTS:3}
ratelimit.passwordReset.refillAmount=${RATE_LIMIT_PASSWORD_RESET_REFILL_AMOUNT:3}
ratelimit.passwordReset.refillHours=${RATE_LIMIT_PASSWORD_RESET_REFILL_HOURS:1}

# Cache configuration
cache.login.expiryHours=${CACHE_LOGIN_EXPIRY_HOURS:1}
cache.passwordReset.expiryHours=${CACHE_PASSWORD_RESET_EXPIRY_HOURS:24}

# Security configuration
security.rememberMe.validitySeconds=${REMEMBER_ME_VALIDITY_SECONDS}
security.rememberMe.key=${REMEMBER_ME_KEY}

# Initial user config
app.admin.username=${ADMIN_USERNAME:}
app.admin.password= ${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.firstName=${ADMIN_FIRST_NAME:}
app.admin.lastName=${ADMIN_LAST_NAME:}
app.admin.initialization.enabled=${ENABLE_ADMIN_CREATION:false}
